<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    交错并联 Boost PFC 设计工具 —— favicon
    造型：两条相位错开的电流波（本站首页主图标 Waves 的加粗版），与页头 BrandMark 同一套 path。
    语义：interleaved —— 两路电感电流纹波相互抵消。
    配色遵循站群统一规范：深底 #0a0a0a / 主形 teal #14b8a6 / amber #f59e0b 仅标关键点
    （amber 落在两波之间的过零处，代表纹波抵消点）。
    16px 可读性：两条粗曲线上下分离，与 AHB 的实心闪电、LLC 的尖峰脉冲均可区分。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <path d="M4 12.5 C 6 10, 8 10, 10 12.5 S 14 15, 16 12.5 S 20 10, 22 12.5 S 26 15, 28 12.5"
        fill="none" stroke="#14b8a6" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M4 20.5 C 6 18, 8 18, 10 20.5 S 14 23, 16 20.5 S 20 18, 22 20.5 S 26 23, 28 20.5"
        fill="none" stroke="#14b8a6" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="16" cy="16.5" r="1.7" fill="#f59e0b"/>
</svg>
