name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 2026-11-24 补：deploy-pages 需要读取本次 run 的 artifact 元数据。
  # 显式声明 permissions 时未列出的权限会被置为 none，缺失时
  # deploy-pages 只能报 "No artifacts named github-pages were found"。
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 质量门禁：lint 失败即中断，不进入构建与部署。
      # 置于 Build 之前，确保坏代码不会上线（此前 CI 只 build 不 lint，门禁形同虚设）。
      - name: Lint
        run: npm run lint

      # 回归门禁：计算库单测（vitest，node 环境）。失败即中断，同 lint 一样不进构建。
      # 置于 Build 之前：算法改动的等价性靠它兜，而不是靠构建能不能过。
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # 2026-11-24 升级：原 v4/v3 版本落后一个大版本，deploy-pages 的
      # api-client 取 artifact 元数据时持续报 "No artifacts named github-pages
      # were found"（artifact 实际每次都上传成功）。v5 系列原生跑 node24，
      # 且新增 artifact_name 输入，这里与上传侧显式对齐名称，消除歧义。
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
